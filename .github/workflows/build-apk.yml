name: APK Oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Gerekli Android paketlerini kur
        run: |
          yes | sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null


      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: index.html var mı kontrol et
        run: |
          if [ ! -f "index.html" ]; then
            echo "HATA: Depo köküne (ana klasöre) index.html dosyası eklemelisin."
            exit 1
          fi


      - name: Android proje iskeletini oluştur
        run: |
          mkdir -p app/src/main/java/com/personeltakip/app
          mkdir -p app/src/main/assets/www
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat > settings.gradle << 'EOF'
          rootProject.name = "PersonelTakip"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'com.personeltakip.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.personeltakip.app"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:label="Personel Takip"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/personeltakip/app/MainActivity.java << 'EOF'
          package com.personeltakip.app;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST_CODE = 1001;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setLayoutParams(new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT));
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                  webView.setWebViewClient(new WebViewClient());

                  webView.addJavascriptInterface(new AndroidBridge(this), "AndroidBridge");

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          filePathCallback = callback;
                          Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                          intent.addCategory(Intent.CATEGORY_OPENABLE);
                          intent.setType("image/*");
                          startActivityForResult(Intent.createChooser(intent, "Fotoğraf seç"), FILE_CHOOSER_REQUEST_CODE);
                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == FILE_CHOOSER_REQUEST_CODE) {
                      if (filePathCallback == null) return;
                      Uri[] results = null;
                      if (resultCode == Activity.RESULT_OK && data != null && data.getData() != null) {
                          results = new Uri[]{ data.getData() };
                      }
                      filePathCallback.onReceiveValue(results);
                      filePathCallback = null;
                  } else {
                      super.onActivityResult(requestCode, resultCode, data);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              // Uygulama içinden (JS) çağrılır: PDF raporunu telefonun İndirilenler klasörüne kaydeder
              public static class AndroidBridge {
                  private final Context context;

                  AndroidBridge(Context context) {
                      this.context = context;
                  }

                  @JavascriptInterface
                  public void savePdf(String base64Data, String fileName) {
                      try {
                          byte[] bytes = android.util.Base64.decode(base64Data, android.util.Base64.DEFAULT);

                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              ContentValues values = new ContentValues();
                              values.put(MediaStore.MediaColumns.DISPLAY_NAME, fileName);
                              values.put(MediaStore.MediaColumns.MIME_TYPE, "application/pdf");
                              values.put(MediaStore.MediaColumns.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                              Uri uri = context.getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values);
                              if (uri != null) {
                                  OutputStream os = context.getContentResolver().openOutputStream(uri);
                                  if (os != null) {
                                      os.write(bytes);
                                      os.close();
                                  }
                              }
                          } else {
                              File downloadsDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS);
                              File file = new File(downloadsDir, fileName);
                              FileOutputStream fos = new FileOutputStream(file);
                              fos.write(bytes);
                              fos.close();
                          }

                          ((Activity) context).runOnUiThread(() ->
                                  Toast.makeText(context, "PDF indirildi: " + fileName, Toast.LENGTH_LONG).show());
                      } catch (Exception e) {
                          ((Activity) context).runOnUiThread(() ->
                                  Toast.makeText(context, "PDF kaydedilemedi: " + e.getMessage(), Toast.LENGTH_LONG).show());
                      }
                  }

                  // Uygulama verisini (personel + izinler) telefonun uygulama klasörüne kaydeder —
                  // internetsizken de son bilinen veri gösterilebilsin diye.
                  @JavascriptInterface
                  public void saveCache(String jsonData) {
                      try {
                          File file = new File(context.getFilesDir(), "data_cache.json");
                          FileOutputStream fos = new FileOutputStream(file);
                          fos.write(jsonData.getBytes("UTF-8"));
                          fos.close();
                      } catch (Exception e) {
                          // önbellek opsiyonel bir hız/offline özelliği, sessizce geç
                      }
                  }

                  @JavascriptInterface
                  public String loadCache() {
                      try {
                          File file = new File(context.getFilesDir(), "data_cache.json");
                          if (!file.exists()) return "";
                          java.io.FileInputStream fis = new java.io.FileInputStream(file);
                          java.io.ByteArrayOutputStream baos = new java.io.ByteArrayOutputStream();
                          byte[] buffer = new byte[2048];
                          int len;
                          while ((len = fis.read(buffer)) != -1) {
                              baos.write(buffer, 0, len);
                          }
                          fis.close();
                          return baos.toString("UTF-8");
                      } catch (Exception e) {
                          return "";
                      }
                  }
              }
          }
          EOF

          echo "" | base64 -d > /tmp/icon.png
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp /tmp/icon.png app/src/main/res/mipmap-$d/ic_launcher.png
            cp /tmp/icon.png app/src/main/res/mipmap-$d/ic_launcher_round.png
          done

          cp index.html app/src/main/assets/www/index.html

          echo "Proje iskeleti hazır."


      - name: APK'yı derle
        run: |
          gradle assembleDebug --stacktrace


      - name: Derleme kontrolü (hata ayıklama için)
        run: |
          echo "--- dex icinde MainActivity var mi kontrolu ---"
          unzip -p app/build/outputs/apk/debug/app-debug.apk classes.dex | strings | grep -i personeltakip || echo "UYARI: MainActivity dex icinde bulunamadi!"


      - name: APK'yı yükle (indirilebilir dosya)
        uses: actions/upload-artifact@v4
        with:
          name: personel-takip-apk
          path: app/build/outputs/apk/debug/app-debug.apk
