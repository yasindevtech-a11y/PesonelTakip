<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Personel Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12141A;
    --surface:#1B1E25;
    --surface2:#242832;
    --surface3:#2B303B;
    --accent:#3ECF8E;
    --accent-dim:#2A6E52;
    --amber:#F2A65A;
    --amber-dim:#5C4326;
    --red:#E5484D;
    --text:#F3F5F7;
    --text-dim:#8B92A0;
    --text-faint:#5C6270;
    --border:#2A2E38;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .display{font-family:"Space Grotesk",-apple-system,sans-serif;}

  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow:0 0 60px rgba(0,0,0,0.4);
  }

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(18,20,26,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:14px 16px 12px;
  }
  .header-top{
    display:flex; align-items:center; gap:10px; margin-bottom:12px;
  }
  .brand{
    display:flex; align-items:center; gap:8px; flex:1;
  }
  .brand-dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
  }
  .brand h1{
    font-size:17px; font-weight:600; letter-spacing:-0.01em;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:10px;
    background:var(--surface2); border:1px solid var(--border);
    color:var(--text); display:flex; align-items:center; justify-content:center;
    cursor:pointer; flex-shrink:0;
    transition:background .15s;
  }
  .icon-btn:hover{background:var(--surface3);}
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-faint);}
  #searchInput{
    width:100%;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 12px 11px 38px;
    color:var(--text);
    font-size:14px;
    outline:none;
  }
  #searchInput:focus{border-color:var(--accent);}
  #searchInput::placeholder{color:var(--text-faint);}

  /* ---------- Dropdown menu ---------- */
  .menu-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.5);
    z-index:30; display:none;
  }
  .menu-overlay.open{display:block;}
  .menu-panel{
    position:absolute; top:64px; right:16px;
    width:220px;
    background:var(--surface2);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
  }
  .menu-item{
    display:flex; align-items:center; gap:10px;
    padding:13px 14px;
    font-size:14px;
    cursor:pointer;
    border-bottom:1px solid var(--border);
    color:var(--text);
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item:hover{background:var(--surface3);}
  .menu-item.admin{color:var(--amber);}

  /* ---------- Views ---------- */
  .view{display:none; flex:1; flex-direction:column;}
  .view.active{display:flex;}
  .content{padding:16px; flex:1; overflow-y:auto;}

  .section-label{
    font-size:12px; font-weight:600; letter-spacing:0.06em;
    color:var(--text-dim); text-transform:uppercase;
    margin:4px 0 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .count-pill{
    background:var(--surface2); color:var(--text-dim);
    font-size:11px; padding:2px 8px; border-radius:20px;
    border:1px solid var(--border);
  }

  /* personnel card */
  .p-card{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:12px; padding:12px;
    margin-bottom:10px; cursor:pointer;
    transition:transform .1s, background .15s;
  }
  .p-card:active{transform:scale(0.98);}
  .p-card.on-leave{border-left-color:var(--amber);}
  .p-card:hover{background:var(--surface2);}
  .avatar{
    width:44px; height:44px; border-radius:10px;
    background:var(--surface3); color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    font-weight:600; font-size:15px; flex-shrink:0; overflow:hidden;
  }
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .p-card-info{flex:1; min-width:0;}
  .p-card-name{font-size:14.5px; font-weight:600;}
  .p-card-sub{font-size:12.5px; color:var(--text-dim); margin-top:2px;}
  .status-chip{
    font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px;
    white-space:nowrap;
  }
  .status-chip.leave{background:var(--amber-dim); color:var(--amber);}
  .status-chip.active{background:var(--accent-dim); color:var(--accent);}

  .empty-state{
    text-align:center; padding:50px 20px; color:var(--text-faint);
  }
  .empty-state .big{font-size:34px; margin-bottom:10px;}
  .empty-state p{font-size:13.5px; line-height:1.5;}

  .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    margin:4px 0 10px;
  }
  .month-nav-label{
    font-size:14.5px; font-weight:700; color:var(--text);
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:11px; padding:13px 16px;
    font-size:14px; font-weight:600; cursor:pointer;
    font-family:inherit;
  }
  .btn-primary{background:var(--accent); color:#0A1712;}
  .btn-primary:active{opacity:0.85;}
  .btn-ghost{background:var(--surface2); color:var(--text); border:1px solid var(--border);}
  .btn-danger{background:rgba(229,72,77,0.12); color:var(--red); border:1px solid rgba(229,72,77,0.3);}
  .btn-block{width:100%;}
  .btn-row{display:flex; gap:10px; margin-top:18px;}

  /* ---------- Form view ---------- */
  .form-header{
    display:flex; align-items:center; gap:12px; padding:16px;
    border-bottom:1px solid var(--border);
  }
  .back-btn{
    width:36px; height:36px; border-radius:10px; background:var(--surface2);
    border:1px solid var(--border); display:flex; align-items:center; justify-content:center;
    color:var(--text); cursor:pointer; flex-shrink:0;
  }
  .form-header h2{font-size:16px; font-weight:600;}

  .photo-upload{
    width:88px; height:88px; border-radius:16px;
    background:var(--surface2); border:1.5px dashed var(--border);
    display:flex; align-items:center; justify-content:center;
    margin:20px auto 22px; cursor:pointer; position:relative;
    overflow:hidden; color:var(--text-faint); font-size:11px; flex-direction:column; gap:4px;
  }
  .photo-upload img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .photo-upload-sm{ margin:0 0 6px !important; width:72px; height:72px; border-radius:12px; }

  .field{margin-bottom:14px;}
  .field label{
    display:block; font-size:12px; font-weight:600; color:var(--text-dim);
    margin-bottom:6px; text-transform:uppercase; letter-spacing:0.04em;
  }
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface2); border:1px solid var(--border);
    border-radius:10px; padding:12px; color:var(--text); font-size:14.5px;
    font-family:inherit; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  /* ---------- Detail view ---------- */
  .detail-hero{
    display:flex; align-items:center; gap:14px; padding:20px 16px;
    border-bottom:1px solid var(--border);
  }
  .detail-avatar{
    width:64px; height:64px; border-radius:14px; background:var(--surface3);
    display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:600;
    color:var(--text-dim); overflow:hidden; flex-shrink:0;
  }
  .detail-avatar img{width:100%; height:100%; object-fit:cover;}
  .detail-name{font-size:18px; font-weight:700;}
  .detail-badge{font-size:12.5px; color:var(--text-dim); margin-top:3px;}

  .info-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:1px;
    background:var(--border); border:1px solid var(--border); border-radius:12px;
    overflow:hidden; margin:16px 0;
  }
  .info-cell{background:var(--surface); padding:11px 13px;}
  .info-cell .k{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:3px;}
  .info-cell .v{font-size:13.5px; font-weight:600;}
  .info-cell.full{grid-column:1/-1;}

  .stat-row{display:flex; gap:10px; margin-bottom:16px;}
  .stat-card{
    flex:1; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:14px;
  }
  .stat-card .label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.04em; margin-bottom:6px;}
  .stat-card .num{font-size:22px; font-weight:700;}
  .stat-card.warn .num{color:var(--amber);}
  .stat-card.good .num{color:var(--accent);}

  .leave-type-chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .type-chip{
    font-size:12.5px; padding:7px 12px; border-radius:20px;
    background:var(--surface2); border:1px solid var(--border); color:var(--text-dim);
    cursor:pointer;
  }
  .type-chip.add{color:var(--accent); border-color:var(--accent-dim);}

  table.history{width:100%; border-collapse:collapse; font-size:13px;}
  table.history th{
    text-align:left; padding:8px 10px; color:var(--text-faint);
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em;
    border-bottom:1px solid var(--border);
  }
  table.history td{padding:10px; border-bottom:1px solid var(--border);}
  table.history tr:last-child td{border-bottom:none;}
  .tag{
    font-size:11px; padding:3px 8px; border-radius:20px;
    background:var(--surface3); color:var(--text-dim); white-space:nowrap;
  }

  /* modal for add leave */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.55);
    z-index:40; display:none; align-items:flex-end; justify-content:center;
  }
  #leaveModal{ z-index:50; } /* İzin ekleme/düzenleme penceresi her zaman personel popup'ının üstünde olmalı */
  .modal-overlay.open{display:flex;}
  .modal-sheet{
    width:100%; max-width:480px; background:var(--surface2);
    border-radius:20px 20px 0 0; padding:18px 16px 24px;
    border:1px solid var(--border); border-bottom:none;
  }
  .modal-sheet h3{font-size:15px; font-weight:600; margin-bottom:16px;}

  /* person detail popup */
  .person-modal-overlay{ align-items:center; padding:0; }
  .person-modal{
    width:100%; max-width:480px; height:88vh; max-height:720px;
    background:var(--surface2); border:1px solid var(--border); border-radius:18px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .person-modal-header{
    display:flex; align-items:center; gap:12px; padding:16px;
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .person-modal-title{flex:1; min-width:0;}
  .pm_name{font-size:15.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pm_sub{font-size:12px; color:var(--text-dim); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .person-modal-body{flex:1; display:flex; overflow:hidden;}
  .pm_sidebar{
    width:92px; flex-shrink:0; background:var(--surface);
    border-right:1px solid var(--border); overflow-y:auto; padding:8px 0;
  }
  .pm_tab{
    padding:11px 8px; font-size:11.5px; font-weight:600; text-align:center;
    color:var(--text-dim); cursor:pointer; border-left:3px solid transparent;
    line-height:1.3;
  }
  .pm_tab.active{color:var(--accent); border-left-color:var(--accent); background:var(--surface2);}
  .pm_content{flex:1; overflow-y:auto; padding:16px;}
  .person-modal-footer{padding:14px 16px; border-top:1px solid var(--border); flex-shrink:0;}
  .pm_leave_entry{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:11px 13px; margin-bottom:8px; font-size:13px;
  }
  .pm_leave_entry_top{ display:flex; align-items:center; justify-content:space-between; }
  .pm_leave_entry .d{font-weight:600;}
  .pm_leave_entry .t{color:var(--text-dim); font-size:12px;}
  .pm_leave_note{ font-size:12px; color:var(--text-dim); margin-top:8px; white-space:pre-wrap; line-height:1.4; }
  .pm_leave_photo{ margin-top:8px; width:100%; max-height:170px; object-fit:cover; border-radius:8px; border:1px solid var(--border); display:block; cursor:pointer; }

  /* accordion */
  .accordion{ border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .accordion-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 14px; background:var(--surface); cursor:pointer;
    font-size:13px; font-weight:600; color:var(--text);
  }
  .accordion-header:hover{ background:var(--surface3); }
  .accordion-body{ padding:14px; border-top:1px solid var(--border); background:var(--surface); }
  .accordion-chevron-open{ transform:rotate(180deg); }
  .online-chip{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-weight:600; color:var(--accent);
    background:var(--accent-dim); padding:6px 11px; border-radius:20px;
  }
  .online-dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); }

  /* admin view */
  .admin-lock{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 30px; text-align:center; gap:14px;
  }
  .admin-lock .lock-icon{color:var(--amber); margin-bottom:6px;}
  .admin-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:12px 14px; margin-bottom:10px;
  }

  ::-webkit-scrollbar{width:0px;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <header>
    <div class="header-top">
      <div class="brand">
        <span class="brand-dot"></span>
        <h1 class="display">Personel Takip</h1>
      </div>
      <div class="icon-btn" id="menuBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
      </div>
    </div>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Personel adı ile ara...">
    </div>
  </header>

  <!-- DROPDOWN MENU -->
  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-panel" id="menuPanel">
      <div class="menu-item admin" data-action="admin">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Ayarlar
      </div>
    </div>
  </div>

  <!-- HOME VIEW -->
  <div class="view active" id="view-home">
    <div class="content">
      <div class="section-label" id="listLabel">
        <span>Bugün İzinde Olanlar</span>
        <span class="count-pill" id="listCount">0</span>
      </div>
      <div id="listContainer"></div>
    </div>
  </div>

  <!-- FORM VIEW (new / edit personnel) -->
  <div class="view" id="view-form">
    <div class="form-header">
      <div class="back-btn" data-back-admin="1">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <h2 id="formTitle">Yeni Personel Kaydı</h2>
    </div>
    <div class="content">
      <label class="photo-upload" id="photoUpload">
        <span id="photoPlaceholder">📷<br>Fotoğraf</span>
        <img id="photoPreview" class="hidden">
        <input type="file" accept="image/*" id="photoInput" style="display:none">
      </label>

      <div class="field">
        <label>Adı Soyadı</label>
        <input type="text" id="f_name" placeholder="Örn. Ahmet Yılmaz">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Telefon</label>
          <input type="tel" id="f_phone" placeholder="05xx xxx xx xx">
        </div>
        <div class="field">
          <label>Unvanı</label>
          <input type="text" id="f_title" placeholder="Örn. Güvenlik Görevlisi">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Parkı</label>
          <input type="text" id="f_park" placeholder="Örn. A Parkı">
        </div>
        <div class="field">
          <label>Sicil / Yaka No</label>
          <input type="text" id="f_badge" placeholder="Örn. 010">
        </div>
      </div>
      <div class="field">
        <label>Yaka Kartı Geçerlilik Tarihi</label>
        <input type="date" id="f_badgeExpiry">
      </div>
      <div class="field">
        <label>Adres</label>
        <textarea id="f_address" rows="2" placeholder="Adres bilgisi"></textarea>
      </div>
      <div class="field">
        <label>İşe Giriş Tarihi</label>
        <input type="date" id="f_hire">
      </div>
      <div class="field">
        <label>Yıllık İzin Hakkı (gün)</label>
        <input type="number" id="f_entitlement" value="14" min="0">
      </div>

      <div class="btn-row">
        <button class="btn btn-ghost btn-block" data-back-admin="1">Vazgeç</button>
        <button class="btn btn-primary btn-block" id="saveBtn">Kaydet</button>
      </div>
    </div>
  </div>

  <!-- ADMIN VIEW -->
  <div class="view" id="view-admin">
    <div class="form-header">
      <div class="back-btn" data-back="home">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </div>
      <h2>Ayarlar</h2>
    </div>
    <div class="content" id="adminContent"></div>
  </div>

</div>

<!-- ADD LEAVE MODAL -->
<div class="modal-overlay" id="leaveModal">
  <div class="modal-sheet">
    <h3 id="lv_modal_title">Yeni İzin Ekle</h3>
    <div class="field">
      <label>İzin Türü</label>
      <select id="lv_type"></select>
    </div>
    <div class="field hidden" id="lv_date_row">
      <label>Tarih</label>
      <input type="date" id="lv_date">
    </div>
    <div class="field-row" id="lv_range_row">
      <div class="field">
        <label>Başlangıç Tarihi</label>
        <input type="date" id="lv_start_date">
      </div>
      <div class="field">
        <label>Bitiş Tarihi</label>
        <input type="date" id="lv_end_date">
      </div>
    </div>
    <div class="field-row hidden" id="lv_time_row">
      <div class="field">
        <label>Başlangıç Saati</label>
        <input type="time" id="lv_start_time">
      </div>
      <div class="field">
        <label>Bitiş Saati</label>
        <input type="time" id="lv_end_time">
      </div>
    </div>
    <div class="field">
      <label>Not (opsiyonel)</label>

function isoToday(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, n){ const d = new Date(dateStr); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function fmt(dateStr){ if(!dateStr) return "-"; const [y,m,d]=dateStr.split("-"); return `${d}.${m}.${y}`; }
function initials(name){ return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function escapeHtml(str){

function leaveDurationText(l){

}

const BADGE_WARN_DAYS = 180;
function badgeStatus(p){
  if(!p.badgeExpiry) return { has:false };
  const today = new Date(isoToday());
  const expiry = new Date(p.badgeExpiry);
  const daysLeft = Math.ceil((expiry - today) / 86400000);
  return {
    has: true,
    daysLeft,
    expired: daysLeft < 0,
    warn: daysLeft < BADGE_WARN_DAYS
  };
}

function isHourly(type){ return !!type && type.toLowerCase().includes("saat"); }
function isAnnual(type){ return !!type && (type.toLowerCase().includes("yıllık") || type.toLowerCase().includes("senelik")); }

// ---------- HOME LIST ----------
function personLeaveStatus(p){
  const today = isoToday();
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  for(const lv of p.leaves){
    if(isHourly(lv.type)){
      if(lv.date === today && lv.startTime && lv.endTime){
        const [sh,sm] = lv.startTime.split(":").map(Number);
        const [eh,em] = lv.endTime.split(":").map(Number);
        if(nowMin >= sh*60+sm && nowMin <= eh*60+em){
          return { onLeave:true, type:lv.type, timeRange:`${lv.startTime}-${lv.endTime}` };
        }
      }
      continue;
    }
    const end = addDays(lv.date, lv.days-1);
    if(today >= lv.date && today <= end){
      return { onLeave:true, type:lv.type, until:end };
    }
  }
  return { onLeave:false };
}
function totalUsedDays(p){ return p.leaves.filter(l=>isAnnual(l.type)).reduce((s,l)=>s+Number(l.days),0); }

function personCardEl(p){
  const status = personLeaveStatus(p);
  const badge = badgeStatus(p);
  const card = document.createElement("div");
  card.className = "p-card" + (status.onLeave ? " on-leave" : "");
  const sub = [p.title, p.park, p.badge ? `Sicil: ${p.badge}` : null].filter(Boolean).join(" · ") || (p.phone || "-");
  let badgeWarnHtml = "";
  if(badge.has && badge.warn){
    badgeWarnHtml = `<div class="p-card-sub" style="color:var(--red); margin-top:3px;">⚠ Yaka kartı ${badge.expired ? "süresi doldu" : `${badge.daysLeft} gün içinde doluyor`}</div>`;
  }
  card.innerHTML = `
    <div class="avatar">${p.photo ? `<img src="${p.photo}">` : initials(p.name)}</div>
    <div class="p-card-info">
      <div class="p-card-name">${p.name}</div>
      <div class="p-card-sub">${sub}</div>
      ${badgeWarnHtml}
    </div>
    <span class="status-chip ${status.onLeave?'leave':'active'}">${status.onLeave ? status.type : 'Görevde'}</span>
  `;
  card.addEventListener("click", ()=> openDetail(p.id));
  return card;
}

function leaveEntryCardEl(p, l){
  const today = isoToday();
  const endDate = l.startTime ? l.date : addDays(l.date, (l.days||1)-1);
  const activeNow = l.startTime && l.endTime
    ? (l.date===today)
    : (today >= l.date && today <= endDate);
  const card = document.createElement("div");
  card.className = "p-card" + (activeNow ? " on-leave" : "");
  card.innerHTML = `
    <div class="avatar">${p.photo ? `<img src="${p.photo}">` : initials(p.name)}</div>
    <div class="p-card-info">
      <div class="p-card-name">${p.name}</div>
      <div class="p-card-sub">${l.type} · ${fmt(l.date)}${l.days>1 ? ` → ${fmt(endDate)}` : ""}${l.startTime ? ` · ${l.startTime}-${l.endTime}` : ""}</div>
    </div>
    ${activeNow ? `<span class="status-chip leave">Şu an</span>` : ""}
  `;
  card.addEventListener("click", ()=> openDetail(p.id));
  return card;
}

const MONTH_NAMES = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const _now = new Date();
let homeViewYear = _now.getFullYear();
let homeViewMonthIdx = _now.getMonth();

function monthBounds(year, monthIdx){
  const start = `${year}-${String(monthIdx+1).padStart(2,"0")}-01`;
  const lastDay = new Date(year, monthIdx+1, 0).getDate();
  const end = `${year}-${String(monthIdx+1).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;
  return { start, end };
}

function leaveOverlapsRange(l, rangeStart, rangeEnd){
  const lEnd = l.startTime ? l.date : addDays(l.date, (l.days||1)-1);
  return l.date <= rangeEnd && lEnd >= rangeStart;
}

function collectMonthLeaveEntries(year, monthIdx){
  const { start, end } = monthBounds(year, monthIdx);
  let entries = [];
  personnel.forEach(p=>{
    p.leaves.forEach(l=>{
      if(leaveOverlapsRange(l, start, end)) entries.push({ p, l });
    });
  });
  entries.sort((a,b)=> a.l.date.localeCompare(b.l.date));
  return entries;
}

function collectUpcomingLeaveEntries(){
  const today = isoToday();
  let entries = [];
  personnel.forEach(p=>{
    p.leaves.forEach(l=>{
      if(l.date > today) entries.push({ p, l });
    });
  });
  entries.sort((a,b)=> a.l.date.localeCompare(b.l.date));
  return entries;
}

  return el;
}

function renderHome(){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const staticLabel = document.getElementById("listLabel");
  const container = document.getElementById("listContainer");
  container.innerHTML = "";

  if(personnel.length===0){
    staticLabel.classList.add("hidden");
    container.innerHTML = `<div class="empty-state">

      <p>Henüz kayıtlı personel yok.<br>Kayıt eklemek için Ayarlar'ı kullanın.</p>
    </div>`;
    return;
  }

  if(q.length>0){
    staticLabel.classList.remove("hidden");
    staticLabel.querySelector("span").textContent = "Arama Sonuçları";
    const list = personnel.filter(p=>p.name.toLowerCase().includes(q));
    document.getElementById("listCount").textContent = list.length;
    if(list.length===0){
      container.innerHTML = `<div class="empty-state"><div class="big">🔍</div><p>Aramanızla eşleşen personel bulunamadı.</p></div>`;
      return;
    }
    list.forEach(p=> container.appendChild(personCardEl(p)));
    return;
  }

  // Default view: yaka kartı uyarıları → ay bazlı izin takvimi → her zaman görünen yaklaşan izinler
  staticLabel.classList.add("hidden");
  const badgeWarnings = personnel
    .filter(p=> badgeStatus(p).warn)
    .sort((a,b)=> badgeStatus(a).daysLeft - badgeStatus(b).daysLeft);

  if(badgeWarnings.length>0){
    container.appendChild(sectionHeaderEl("⚠ Yaka Kartı Süresi Yaklaşan / Dolan", badgeWarnings.length, true));
    badgeWarnings.forEach(p=> container.appendChild(personCardEl(p)));
  }

  // Ay navigasyonu
  const monthNav = document.createElement("div");
  monthNav.className = "month-nav";
  if(badgeWarnings.length>0) monthNav.style.marginTop = "18px";
  monthNav.innerHTML = `
    <div class="icon-btn" id="prevMonthBtn" style="width:34px;height:34px; font-size:18px;">‹</div>
    <span class="month-nav-label">${MONTH_NAMES[homeViewMonthIdx]} ${homeViewYear}</span>
    <div class="icon-btn" id="nextMonthBtn" style="width:34px;height:34px; font-size:18px;">›</div>
  `;
  container.appendChild(monthNav);

  const monthEntries = collectMonthLeaveEntries(homeViewYear, homeViewMonthIdx);
  const monthHeader = sectionHeaderEl("Bu Ayki İzinler", monthEntries.length, false);
  monthHeader.style.marginTop = "6px";
  container.appendChild(monthHeader);

  if(monthEntries.length===0){
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.style.padding = "24px";
    empty.innerHTML = `<div class="big">🗂️</div><p>Bu ayda kayıtlı izin yok.</p>`;
    container.appendChild(empty);
  } else {
    monthEntries.forEach(({p,l})=> container.appendChild(leaveEntryCardEl(p,l)));
  }

  document.getElementById("prevMonthBtn").addEventListener("click", ()=>{
    homeViewMonthIdx--;
    if(homeViewMonthIdx < 0){ homeViewMonthIdx = 11; homeViewYear--; }
    renderHome();
  });
  document.getElementById("nextMonthBtn").addEventListener("click", ()=>{
    homeViewMonthIdx++;
    if(homeViewMonthIdx > 11){ homeViewMonthIdx = 0; homeViewYear++; }
    renderHome();
  });

  // Yaklaşan izinler — hangi ay gezilirse gezilsin her zaman görünür
  const upcoming = collectUpcomingLeaveEntries();
  if(upcoming.length>0){
    const upcomingHeader = sectionHeaderEl("🔜 Yaklaşan İzinler", upcoming.length, false);
    upcomingHeader.style.marginTop = "18px";
    container.appendChild(upcomingHeader);
    upcoming.forEach(({p,l})=> container.appendChild(leaveEntryCardEl(p,l)));
  }
}

    const entries = p.leaves.filter(l=>l.type===type).slice().sort((a,b)=> b.date.localeCompare(a.date));
    if(entries.length===0){
      content.innerHTML = `<div class="empty-state" style="padding:30px 10px;"><div class="big">📋</div><p>"${type}" türünde henüz kayıt yok.</p></div>`;
    } else {
      content.innerHTML = `<div class="section-label"><span>${type}</span><span class="count-pill">${entries.length}</span></div>` +
        entries.map(l=>`
          <div class="pm_leave_entry">
            <div class="pm_leave_entry_top">
              <div>
                <span class="d">${fmt(l.date)}</span>
                <span class="t">${leaveDurationText(l)}</span>
              </div>
              ${isAdminAuthenticated ? `
              <div style="display:flex; gap:6px;">
                <button class="icon-btn pm-entry-edit" data-leave-id="${l.id}" style="width:28px;height:28px;">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="icon-btn pm-entry-del" data-leave-id="${l.id}" style="width:28px;height:28px; color:var(--red);">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                </button>
              </div>` : ""}
            </div>
            ${l.note ? `<div class="pm_leave_note">${escapeHtml(l.note)}</div>` : ""}
          </div>
        `).join("");

      if(isAdminAuthenticated){
        content.querySelectorAll(".pm-entry-edit").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const leave = p.leaves.find(l=>l.id===Number(btn.dataset.leaveId));
            openLeaveModal(p.id, leave);
          });
        });
        content.querySelectorAll(".pm-entry-del").forEach(btn=>{
          btn.addEventListener("click", ()=> deleteLeaveEntry(Number(btn.dataset.leaveId)));
        });
      }
    }
  }

  const footerBtn = document.getElementById("pm_addLeaveBtn");
  const footerNote = document.getElementById("pm_observer_note");
  if(isAdminAuthenticated){
    footerBtn.classList.remove("hidden");
    footerNote.classList.add("hidden");
  } else {
    footerBtn.classList.add("hidden");
    footerNote.classList.remove("hidden");
  }
}

// ---------- LEAVE MODAL (ekleme + düzenleme) ----------
const leaveModal = document.getElementById("leaveModal");
let leaveModalPersonId = null;
let editingLeaveId = null;

function toggleLeaveModalFields(){
  const type = document.getElementById("lv_type").value;
  const hourly = isHourly(type);
  document.getElementById("lv_date_row").classList.toggle("hidden", !hourly);
  document.getElementById("lv_time_row").classList.toggle("hidden", !hourly);
  document.getElementById("lv_range_row").classList.toggle("hidden", hourly);
}

function openLeaveModal(personId, existingLeave){
  if(!isAdminAuthenticated){ return; }
  leaveModalPersonId = personId;
  editingLeaveId = existingLeave ? existingLeave.id : null;

  const sel = document.getElementById("lv_type");
  sel.innerHTML = leaveTypes.map(t=>`<option value="${t}">${t}</option>`).join("");
  sel.onchange = toggleLeaveModalFields;

  document.getElementById("lv_modal_title").textContent = existingLeave ? "İzni Düzenle" : "Yeni İzin Ekle";
  document.getElementById("lv_save").textContent = existingLeave ? "Güncelle" : "Ekle";

  if(existingLeave){
    sel.value = existingLeave.type;
    document.getElementById("lv_date").value = existingLeave.date;
    document.getElementById("lv_start_date").value = existingLeave.date;
    document.getElementById("lv_end_date").value = addDays(existingLeave.date, (existingLeave.days||1)-1);
    document.getElementById("lv_start_time").value = existingLeave.startTime || "";
    document.getElementById("lv_end_time").value = existingLeave.endTime || "";
    document.getElementById("lv_note").value = existingLeave.note || "";
  } else {
    document.getElementById("lv_date").value = isoToday();
    document.getElementById("lv_start_date").value = isoToday();
    document.getElementById("lv_end_date").value = isoToday();
    document.getElementById("lv_start_time").value = "";
    document.getElementById("lv_end_time").value = "";
    document.getElementById("lv_note").value = "";
  }
  toggleLeaveModalFields();
  leaveModal.classList.add("open");
}
document.getElementById("lv_cancel").addEventListener("click", ()=> leaveModal.classList.remove("open"));
leaveModal.addEventListener("click", (e)=>{ if(e.target===leaveModal) leaveModal.classList.remove("open"); });
document.getElementById("lv_save").addEventListener("click", async ()=>{
  const type = document.getElementById("lv_type").value;
  let payload = { type, note: document.getElementById("lv_note").value.trim() || null };

  if(isHourly(type)){
    const date = document.getElementById("lv_date").value;
    if(!date){ alert("Lütfen tarih seçin."); return; }
    const startTime = document.getElementById("lv_start_time").value;
    const endTime = document.getElementById("lv_end_time").value;
    if(!startTime || !endTime){ alert("Lütfen başlangıç ve bitiş saatini girin."); return; }
    if(endTime <= startTime){ alert("Bitiş saati başlangıçtan sonra olmalı."); return; }
    payload.date = date;
    payload.start_time = startTime;
    payload.end_time = endTime;
    payload.days = 0;
  } else {
    const startDate = document.getElementById("lv_start_date").value;
    const endDate = document.getElementById("lv_end_date").value;
    if(!startDate || !endDate){ alert("Lütfen başlangıç ve bitiş tarihini seçin."); return; }
    if(endDate < startDate){ alert("Bitiş tarihi, başlangıç tarihinden önce olamaz."); return; }
    const days = Math.round((new Date(endDate) - new Date(startDate)) / 86400000) + 1;
    payload.date = startDate;
    payload.days = days;
    payload.start_time = null;
    payload.end_time = null;
  }

  const saveLvBtn = document.getElementById("lv_save");
  const busyLabel = editingLeaveId ? "Güncelleniyor..." : "Ekleniyor...";
  saveLvBtn.disabled = true; saveLvBtn.textContent = busyLabel;

  let error;
  if(editingLeaveId){
    ({ error } = await db.from("leaves").update(payload).eq("id", editingLeaveId));
  } else {
    payload.personnel_id = leaveModalPersonId;
    ({ error } = await db.from("leaves").insert(payload));
  }

  saveLvBtn.disabled = false;
  if(error){ alert((editingLeaveId ? "Güncellenemedi: " : "İzin eklenemedi: ") + error.message); return; }

  leaveModal.classList.remove("open");
  editingLeaveId = null;
  currentDetailTab = type;
  await loadPersonnel();
  if(personModalOverlay.classList.contains("open")) renderPersonModal();
  if(typeof renderLeaveRecordsList === "function") renderLeaveRecordsList();
  renderHome();
});

async function addAnnualEntitlement(personId){
  if(!isAdminAuthenticated) return;
  const p = personnel.find(x=>x.id===personId);
  if(!p) return;
  const input = prompt(`${p.name} için kaç gün yıllık izin hakkı eklensin?\n(Mevcut hak: ${p.entitlement} gün)`, "14");
  if(input === null) return;
  const addDays = Number(input);
  if(!addDays || addDays <= 0){ alert("Lütfen geçerli, pozitif bir gün sayısı girin."); return; }
  const newEntitlement = p.entitlement + addDays;
  if(!confirm(`${p.name} için yıllık izin hakkı ${p.entitlement} gün'den ${newEntitlement} gün'e çıkarılacak. Onaylıyor musunuz?`)) return;

  const { error } = await db.from("personnel").update({ entitlement: newEntitlement }).eq("id", personId);
  if(error){ alert("Güncellenemedi: " + error.message); return; }
  await loadPersonnel();
  if(personModalOverlay.classList.contains("open")) renderPersonModal();
  renderHome();
}

async function deleteLeaveEntry(leaveId){
  if(!isAdminAuthenticated) return;
  if(!confirm("Bu izin kaydını silmek istediğinize emin misiniz?")) return;
  const { error } = await db.from("leaves").delete().eq("id", leaveId);
  if(error){ alert("Silinemedi: " + error.message); return; }
  await loadPersonnel();
  if(personModalOverlay.classList.contains("open")) renderPersonModal();
  if(typeof renderLeaveRecordsList === "function") renderLeaveRecordsList();
  renderHome();
}

function renderLeaveRecordsList(){
  const container = document.getElementById("lr_records_container");
  const select = document.getElementById("lr_person_select");
  if(!container || !select) return;
  const p = personnel.find(x=>x.id===Number(select.value));
  if(!p){
    container.innerHTML = `<div class="empty-state" style="padding:20px;"><p>Personel bulunamadı.</p></div>`;
    return;
  }
  const entries = p.leaves.slice().sort((a,b)=> b.date.localeCompare(a.date));
  if(entries.length===0){
    container.innerHTML = `<div class="empty-state" style="padding:20px;"><p>${p.name} için henüz izin kaydı yok.</p></div>`;
    return;
  }
  container.innerHTML = entries.map(l=>`
    <div class="pm_leave_entry">
      <div class="pm_leave_entry_top">
        <div>
          <span class="d">${fmt(l.date)}</span>
          <span class="tag" style="margin:0 6px;">${l.type}</span>
          <span class="t">${leaveDurationText(l)}</span>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="icon-btn lr-entry-edit" data-leave-id="${l.id}" style="width:28px;height:28px;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn lr-entry-del" data-leave-id="${l.id}" style="width:28px;height:28px; color:var(--red);">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          </button>
        </div>
      </div>
      ${l.note ? `<div class="pm_leave_note">${escapeHtml(l.note)}</div>` : ""}
    </div>
  `).join("");
  container.querySelectorAll(".lr-entry-edit").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const leave = p.leaves.find(l=>l.id===Number(btn.dataset.leaveId));
      openLeaveModal(p.id, leave);
    });
  });
  container.querySelectorAll(".lr-entry-del").forEach(btn=>{
    btn.addEventListener("click", ()=> deleteLeaveEntry(Number(btn.dataset.leaveId)));
  });
}

let pdfFontsRegistered = false;
function registerPdfFonts(doc){
  if(!pdfFontsRegistered){
    doc.addFileToVFS("DejaVuSans.ttf", PDF_FONT_REGULAR);
    doc.addFont("DejaVuSans.ttf", "DejaVuSans", "normal");
    doc.addFileToVFS("DejaVuSans-Bold.ttf", PDF_FONT_BOLD);
    doc.addFont("DejaVuSans-Bold.ttf", "DejaVuSans", "bold");
    pdfFontsRegistered = true;
  } else {
    doc.addFileToVFS("DejaVuSans.ttf", PDF_FONT_REGULAR);
    doc.addFont("DejaVuSans.ttf", "DejaVuSans", "normal");
    doc.addFileToVFS("DejaVuSans-Bold.ttf", PDF_FONT_BOLD);
    doc.addFont("DejaVuSans-Bold.ttf", "DejaVuSans", "bold");
  }
  doc.setFont("DejaVuSans", "normal");
}

function savePdfBridgeAware(doc, fileName){
  if(window.AndroidBridge && window.AndroidBridge.savePdf){
    const dataUri = doc.output("datauristring");
    const base64 = dataUri.split(",")[1];
    window.AndroidBridge.savePdf(base64, fileName);
  } else {
    doc.save(fileName);
  }
}

function generateLeaveReportPdf(){
  const start = document.getElementById("pdf_start").value;
  const end = document.getElementById("pdf_end").value;
  if(!start || !end){ alert("Lütfen başlangıç ve bitiş tarihini seçin."); return; }
  if(end < start){ alert("Bitiş tarihi, başlangıç tarihinden önce olamaz."); return; }

  let rows = [];
  personnel.forEach(p=>{
    p.leaves.forEach(l=>{
      if(l.date >= start && l.date <= end){
        rows.push([
          p.name,
          l.type,
          fmt(l.date),
          leaveDurationText(l),
          l.note || ""
        ]);
      }
    });
  });

  if(rows.length === 0){ alert("Seçilen tarih aralığında hiç izin kaydı bulunamadı."); return; }
  rows.sort((a,b)=> a[0].localeCompare(b[0], "tr") || a[2].localeCompare(b[2]));

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  registerPdfFonts(doc);

  doc.setFont("DejaVuSans", "bold");
  doc.setFontSize(15);
  doc.text("Personel İzin Raporu", 14, 17);

  doc.setFont("DejaVuSans", "normal");
  doc.setFontSize(10);
  doc.text(`Tarih aralığı: ${fmt(start)} - ${fmt(end)}`, 14, 24);
  doc.text(`Oluşturulma tarihi: ${fmt(isoToday())}`, 14, 29);
  doc.text(`Toplam kayıt: ${rows.length}`, 14, 34);

  doc.autoTable({
    startY: 40,
    head: [["Personel", "İzin Türü", "Tarih", "Süre", "Not"]],
    body: rows,
    styles: { font: "DejaVuSans", fontSize: 9, cellPadding: 3 },
    headStyles: { font: "DejaVuSans", fontStyle: "bold", fillColor: [62, 207, 142], textColor: [10, 23, 18] },
    alternateRowStyles: { fillColor: [245, 247, 247] }
  });

  const fileName = `izin-raporu-${start}_${end}.pdf`;
  savePdfBridgeAware(doc, fileName);
}

          <label>Yeni Şifre (Tekrar)</label>
          <input type="password" id="pw_confirm">
        </div>
        <button class="btn btn-ghost btn-block" id="pw_updateBtn">Şifreyi Güncelle</button>
      </div>
    </div>
  `;

  document.getElementById("adminLogoutBtn").addEventListener("click", ()=>{
    isAdminAuthenticated = false;
    renderHome();
    openAdmin();
  });
  document.getElementById("newPersonBtn").addEventListener("click", ()=> openForm(null));

  // Toplu yıllık izin hakkı ekle
  document.getElementById("bulkEntitlementAccordionHeader").addEventListener("click", ()=>{
    document.getElementById("bulkEntitlementAccordionBody").classList.toggle("hidden");
    document.getElementById("bulkEntitlementAccordionChevron").classList.toggle("accordion-chevron-open");
  });
  document.getElementById("bulk_entitlement_btn").addEventListener("click", async ()=>{
    const days = Number(document.getElementById("bulk_entitlement_days").value);
    if(!days || days <= 0){ alert("Lütfen geçerli, pozitif bir gün sayısı girin."); return; }
    if(personnel.length===0){ alert("Kayıtlı personel yok."); return; }
    if(!confirm(`${personnel.length} personelin yıllık izin hakkına ${days} gün eklenecek. Onaylıyor musunuz?`)) return;

    const btn = document.getElementById("bulk_entitlement_btn");
    btn.disabled = true; btn.textContent = "Ekleniyor...";
    let errorCount = 0;
    for(const p of personnel){
      const { error } = await db.from("personnel").update({ entitlement: p.entitlement + days }).eq("id", p.id);
      if(error) errorCount++;
    }
    await loadPersonnel();
    renderAdminPanel();
    renderHome();
    if(errorCount > 0){
      alert(`${errorCount} personelde hata oluştu, diğerleri güncellendi.`);
    } else {
      alert("Tüm personelin yıllık izin hakkı güncellendi.");
    }
  });

  // İzin raporu (PDF)
  document.getElementById("pdf_generateBtn").addEventListener("click", generateLeaveReportPdf);
  document.getElementById("pdfAccordionHeader").addEventListener("click", ()=>{
    document.getElementById("pdfAccordionBody").classList.toggle("hidden");
    document.getElementById("pdfAccordionChevron").classList.toggle("accordion-chevron-open");
  });

  // İzin kayıtlarını düzenle/sil
  const lrSelect = document.getElementById("lr_person_select");
  lrSelect.innerHTML = personnel.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
  lrSelect.addEventListener("change", renderLeaveRecordsList);
  renderLeaveRecordsList();
  document.getElementById("leaveRecordsAccordionHeader").addEventListener("click", ()=>{
    document.getElementById("leaveRecordsAccordionBody").classList.toggle("hidden");
    document.getElementById("leaveRecordsAccordionChevron").classList.toggle("accordion-chevron-open");
  });

  const list = document.getElementById("adminList");
  if(personnel.length===0){
    list.innerHTML = `<div class="empty-state" style="padding:24px;"><p>Henüz kayıtlı personel yok.</p></div>`;
  }
  personnel.forEach(p=>{
    const badge = badgeStatus(p);
    const row = document.createElement("div");
    row.className = "admin-row";
    row.innerHTML = `
      <div style="display:flex; align-items:center; gap:10px; min-width:0;">
        <div class="avatar" style="width:34px;height:34px;font-size:12px; flex-shrink:0;">${p.photo ? `<img src="${p.photo}">` : initials(p.name)}</div>
        <div style="min-width:0;">
          <div style="font-size:13.5px; font-weight:600;">${p.name}</div>
          <div style="font-size:11.5px; color:var(--text-dim);">${p.title || '-'} · Sicil: ${p.badge||'-'}</div>
          ${badge.has && badge.warn ? `<div style="font-size:11px; color:var(--red); margin-top:2px;">⚠ Yaka kartı ${badge.expired ? 'süresi doldu' : badge.daysLeft+' gün kaldı'}</div>` : ""}
        </div>
      </div>
      <div style="display:flex; gap:6px; flex-shrink:0;">
        <button class="icon-btn" data-edit="${p.id}" style="width:32px;height:32px;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="icon-btn" data-del="${p.id}" style="width:32px;height:32px; color:var(--red);">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>
      </div>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll("[data-edit]").forEach(b=> b.addEventListener("click", ()=> openForm(Number(b.dataset.edit))));
  list.querySelectorAll("[data-del]").forEach(b=> b.addEventListener("click", async ()=>{
    const p = personnel.find(x=>x.id===Number(b.dataset.del));
    if(confirm(`${p.name} kaydını silmek istediğinize emin misiniz?`)){
      const { error } = await db.from("personnel").delete().eq("id", p.id);
      if(error){ alert("Silinemedi: " + error.message); return; }
      await loadPersonnel();
      renderAdminPanel();
      renderHome();
    }
  }));

  const typeWrap = document.getElementById("adminTypeChips");
  leaveTypes.forEach((t)=>{
    const chip = document.createElement("span");
    chip.className = "type-chip";
    chip.textContent = t + " ✕";
    chip.addEventListener("click", async ()=>{
      if(confirm(`"${t}" türünü kaldırmak istiyor musunuz?`)){
        const { error } = await db.from("leave_types").delete().eq("name", t);
        if(error){ alert("Silinemedi: " + error.message); return; }
        await loadLeaveTypes();
        renderAdminPanel();
      }
    });
    typeWrap.appendChild(chip);
  });
  document.getElementById("addTypeBtn").addEventListener("click", async ()=>{
    const t = prompt("Yeni izin türü adı:");
    if(t && t.trim()){
      const { error } = await db.from("leave_types").insert({ name: t.trim() });
      if(error){ alert("Eklenemedi: " + error.message); return; }
      await loadLeaveTypes();
      renderAdminPanel();
    }
  });

  // accordion toggles
  document.getElementById("typeAccordionHeader").addEventListener("click", ()=>{
    document.getElementById("typeAccordionBody").classList.toggle("hidden");
    document.getElementById("typeAccordionChevron").classList.toggle("accordion-chevron-open");
  });
  document.getElementById("pwAccordionHeader").addEventListener("click", ()=>{
    document.getElementById("pwAccordionBody").classList.toggle("hidden");
    document.getElementById("pwAccordionChevron").classList.toggle("accordion-chevron-open");
  });

  // password change
  document.getElementById("pw_updateBtn").addEventListener("click", async ()=>{
    const cur = document.getElementById("pw_current").value;
    const nw = document.getElementById("pw_new").value;
    const cf = document.getElementById("pw_confirm").value;
    if(cur !== adminPassword){ alert("Mevcut şifre yanlış."); return; }
    if(!nw || nw.length < 4){ alert("Yeni şifre en az 4 karakter olmalı."); return; }
    if(nw !== cf){ alert("Yeni şifreler eşleşmiyor."); return; }
    const { error } = await db.from("app_settings").update({ value: nw }).eq("key","admin_password");
    if(error){ alert("Şifre güncellenemedi: " + error.message); return; }
    adminPassword = nw;
    alert("Şifre güncellendi.");
    document.getElementById("pw_current").value = "";
    document.getElementById("pw_new").value = "";
    document.getElementById("pw_confirm").value = "";
  });
}

// ---------- INIT ----------
loadAll();
</script>
</body>
</html>
